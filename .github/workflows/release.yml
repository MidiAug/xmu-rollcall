name: Release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag || { echo 'Select an existing version tag when dispatching this workflow.'; exit 1; }
          python scripts/ci/artifacts.py version --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Require stable Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing repository secret: $name"; exit 1; }
          done

  quality:
    needs: preflight
    uses: ./.github/workflows/_quality.yml

  packages:
    needs: quality
    uses: ./.github/workflows/_build.yml
    with:
      signed: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  draft:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Verify both platforms and exact source commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/ci/artifacts.py verify --directory dist --tag "$RELEASE_TAG"
      - name: Create or refresh draft (never modify a published release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true || { echo 'Release is already published; refusing to replace its assets.'; exit 1; }
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" \
              --generate-notes --notes 'Android uses the configured signing key. Windows binaries are not Authenticode signed. Verify SHA256SUMS and complete device acceptance before publishing.'
          fi
          echo 'Release draft prepared. Device acceptance and publication remain manual.' >> "$GITHUB_STEP_SUMMARY"
