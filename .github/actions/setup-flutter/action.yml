name: Set up locked Flutter dependencies
description: Shared Flutter SDK version and strict dependency installation
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.44.0'
        channel: stable
        cache: true
    - shell: pwsh
      # Hosted source identity is part of pubspec.lock, not just its versions.
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
      run: flutter pub get --enforce-lockfile
