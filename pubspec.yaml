name: xmu_rollcall
description: "XMU TronClass multi-platform rollcall client (Flutter)."
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  webview_flutter: ^4.10.0
  geolocator: ^13.0.4
  uuid: ^4.5.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  window_manager: ^0.5.1
  pointycastle: ^3.9.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.2
  share_plus: ^12.0.2
  archive: ^4.3.0
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  tray_manager: 0.5.2
  local_notifier: ^0.1.6
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  zxing2: ^0.2.4
  image: ^4.12.0
  desktop_multi_window: ^0.3.1
  desktop_drop: 0.7.0
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon.ico
    - assets/tray/tray_icon.png
